<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Blocked — DeepFocus</title>
  <style>
    :root {
      --bg: #15171c;
      --text: #ecedef;
      --muted: #868b96;
      --brass: #c9a227;
    }
    * { box-sizing: border-box; }
    html, body {
      height: 100%;
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      text-align: center;
      max-width: 380px;
      padding: 40px;
    }
    svg { color: var(--brass); margin-bottom: 18px; }
    h1 {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 24px;
      margin: 0 0 10px;
    }
    p {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
      margin: 0 0 22px;
    }
    #site {
      font-family: ui-monospace, "SF Mono", Menlo, monospace;
      color: var(--text);
    }
    button {
      background: none;
      border: 1px solid #2b2f38;
      color: var(--text);
      border-radius: 6px;
      padding: 9px 18px;
      font-size: 13px;
      cursor: pointer;
    }
    button:hover { border-color: var(--brass); }
  </style>
</head>
<body>
  <div class="card">
    <svg width="30" height="30" viewBox="0 0 24 24" fill="none">
      <rect x="4" y="2" width="14" height="20" rx="1" stroke="currentColor" stroke-width="1.4"/>
      <circle cx="14.5" cy="12" r="1.3" fill="currentColor"/>
    </svg>
    <h1>The door's closed.</h1>
    <p><span id="site"></span> is on your blocked list. Open DeepFocus from the toolbar if you want to let it back in.</p>
    <button id="back-btn">Go back</button>
  </div>
  <script src="blocked.js"></script>
</body>
</html>
