<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>DeepFocus</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header class="header">
    <svg class="deepfocus-mark" width="22" height="22" viewBox="0 0 24 24" fill="none">
      <rect x="4" y="2" width="14" height="20" rx="1" stroke="currentColor" stroke-width="1.4"/>
      <circle cx="14.5" cy="12" r="1.3" fill="currentColor"/>
    </svg>
    <div>
      <h1>DeepFocus</h1>
      <p class="tagline">Close the door on distracting sites.</p>
      <div class="status-row">
        <label class="switch">
            <input type="checkbox" id="active-toggle" />
            <span class="slider"></span>
        </label>
        <span id="status-label" class="status-label">Active</span>
      </div>
      <div class="account-row">
        <span id="account-label">Guest</span>
        <button type="button" id="account-action" class="account-btn">
          Log in
        </button>
      </div>
      <div class="stats-card">
        <div class="stat">
          <span class="stats-label">Blocked sites</span>
          <strong id="site-count">0</strong>
        </div>

        <div class="stat-divider"></div>

        <div class="stat">
          <span class="stats-label">Block attempts</span>
          <strong id="blocked-count">0</strong>
        </div>
      </div>
    </div>
  </header>

  <form id="add-form" class="add-row" autocomplete="off">
    <input
      id="site-input"
      type="text"
      placeholder="facebook.com"
      aria-label="Website to block"
      inputmode="url"
    />
    <button type="submit">Add</button>
  </form>
  <p id="error-msg" class="error-msg" hidden></p>

  <ul id="site-list" class="site-list"></ul>
  <p id="empty-msg" class="empty-msg">No sites blocked yet — add one above.</p>

  <script src="auth.js"></script>
  <script src="popup.js"></script>
</body>
</html>
