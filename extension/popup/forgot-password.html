<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>DeepFocus — Forgot Password</title>
  <link rel="stylesheet" href="login-form.css" />
</head>

<body>
  <main class="auth-container">

    <button
      id="back-btn"
      type="button"
      class="back-btn"
    >
      ← Back to Login
    </button>


    <div class="brand">

      <svg
        width="28"
        height="28"
        viewBox="0 0 24 24"
        fill="none"
      >
        <rect
          x="4"
          y="2"
          width="14"
          height="20"
          rx="1"
          stroke="currentColor"
          stroke-width="1.4"
        />

        <circle
          cx="14.5"
          cy="12"
          r="1.3"
          fill="currentColor"
        />
      </svg>

      <h1>Forgot password?</h1>

      <p>
        Enter your email and we'll send you a
        password reset link.
      </p>

    </div>


    <form
      id="forgot-password-form"
      autocomplete="on"
    >

      <label for="email">
        Email
      </label>

      <input
        id="email"
        type="email"
        autocomplete="email"
        placeholder="you@example.com"
        required
      />


      <p
        id="error-msg"
        class="error-msg"
        hidden
      ></p>


      <p
        id="success-msg"
        class="success-msg"
        hidden
      ></p>


      <button
        id="submit-btn"
        type="submit"
      >
        Send Reset Link
      </button>

    </form>

  </main>


  <script src="/config.js"></script>
  <script src="forgot-password.js"></script>
</body>
</html>
