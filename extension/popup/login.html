<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>DeepFocus</title>
  <link rel="stylesheet" href="login.css" />
</head>

<body>
  <main class="auth-container">

    <div class="brand">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none">
        <rect
          x="4"
          y="2"
          width="14"
          height="20"
          rx="1"
          stroke="currentColor"
          stroke-width="1.4"
        />
        <circle
          cx="14.5"
          cy="12"
          r="1.3"
          fill="currentColor"
        />
      </svg>

      <h1>DeepFocus</h1>
      <p>Close the door on distracting sites.</p>
    </div>

    <div class="auth-options">

      <button id="guest-btn" class="primary-btn">
        Continue as Guest
      </button>

      <div class="separator">
        <span>or</span>
      </div>

      <button id="login-btn" class="secondary-btn">
        Login
      </button>

    </div>

  </main>

  <script src="login.js"></script>
</body>
</html>
