<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>DeepFocus — Login</title>
  <link rel="stylesheet" href="login-form.css" />
</head>

<body>
  <main class="auth-container">

    <button id="back-btn" type="button" class="back-btn">← Back</button>

    <div class="brand">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none">
        <rect
          x="4"
          y="2"
          width="14"
          height="20"
          rx="1"
          stroke="currentColor"
          stroke-width="1.4"
        />
        <circle
          cx="14.5"
          cy="12"
          r="1.3"
          fill="currentColor"
        />
      </svg>

      <h1 id="form-title">Login</h1>
      <p id="form-subtitle">Sign in to sync your DeepFocus settings.</p>
    </div>

    <form id="auth-form" autocomplete="on">

      <label for="email">Email</label>
      <input
        id="email"
        type="email"
        autocomplete="email"
        placeholder="you@example.com"
        required
      />

      <label for="password">Password</label>
      <input
        id="password"
        type="password"
        autocomplete="current-password"
        placeholder="••••••••"
        minlength="8"
        required
      />

      <p id="error-msg" class="error-msg" hidden></p>

      <button id="submit-btn" type="submit">
        Login
      </button>
    </form>

    <button id="mode-toggle" type="button" class="mode-toggle">
      Don't have an account? Create one
    </button>

  </main>

  <script src="auth.js"></script>
  <script src="login-form.js"></script>
  
</body>
</html>
